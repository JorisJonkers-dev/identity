# Which CI jobs a changed path reaches (JorisJonkers-dev/github-workflows docs/path-buckets.md).
# A path no bucket claims runs everything: the Taskfile, the toolchain, the root package files,
# the Dockerfile and the workflows change how every suite builds or runs, so they are in none.
# The fixtures are the self-test: one path for every pattern, and [] for a path in no bucket.

buckets:
  # Go code and what only Go reads.
  go:
    - '**/*.go'
    - 'go.mod'
    - 'go.sum'
    - '.golangci.yml'
    - 'scripts/coverage.sh'
    - 'deploy/crd/**' # the integration tests apply it to a real API server
    - 'deploy/alerts/**' # the integration tests run promtool on it
    - 'contract/principal/**' # the Principal contract, which the Go tests hold the Gate to
    - 'contract/flows/**' # the flow-conformance suite, vetted with the Go lint
  # The schema and what migrates it.
  db:
    - 'db/**'
    - 'sqlc.yaml'
    - 'compose.yaml'
    - 'Dockerfile.migration'
  # The contract both sides are generated from.
  contract:
    - 'openapi/**'
  # The Vue app.
  web:
    - 'web/**'
    - '!web/**/*.go'
  # What no CI job reads.
  ignore:
    - 'docs/**'
    - '*.md'
    - 'deploy/**'
    - '!deploy/crd/**'
    - '!deploy/alerts/**'
    - 'LICENSE'
    - 'renovate.json'
    - 'release-please-config.json'
    - '.release-please-manifest.json'
    - '.github/CODEOWNERS'
    - '.github/dependabot.yml'
    - '.editorconfig'
    - '.gitattributes'
    - '.gitignore'

groups:
  # Anything the binary is built from: build, e2e, images and gen:check run on it.
  app: [go, db, contract, web]

fixtures:
  deploy/alerts/identity.rules.yaml: [go]
  cmd/identity/main.go: [go]
  internal/server/server_test.go: [go]
  web/embed.go: [go]
  contract/principal/mapping.json: [go]
  contract/principal/go.mod: [go]
  contract/flows/scenarios.go: [go]
  contract/flows/README.md: [go]
  go.mod: [go]
  go.sum: [go]
  .golangci.yml: [go]
  scripts/coverage.sh: [go]
  db/changelog/changelog.yaml: [db]
  db/queries/health.sql: [db]
  sqlc.yaml: [db]
  compose.yaml: [db]
  Dockerfile.migration: [db]
  openapi/v1/openapi.yaml: [contract]
  web/src/main.ts: [web]
  web/package.json: [web]
  docs/adr/0011-unit-tests-reach-every-statement-branch-condition-and-function.md: [ignore]
  README.md: [ignore]
  CONTEXT.md: [ignore]
  deploy/identity.project.yml: [ignore]
  deploy/crd/clients.identity.jorisjonkers.dev.yaml: [go]
  LICENSE: [ignore]
  renovate.json: [ignore]
  release-please-config.json: [ignore]
  .release-please-manifest.json: [ignore]
  .github/CODEOWNERS: [ignore]
  .github/dependabot.yml: [ignore]
  .editorconfig: [ignore]
  .gitattributes: [ignore]
  .gitignore: [ignore]
  .github/workflows/ci.yml: []
