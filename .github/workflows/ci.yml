# One pipeline ending in "Pipeline Complete", the only required check (estate convention).
# Every check is its own job, and they run in parallel: a pull request waits for the slowest
# check rather than the sum of them. Each job runs one `task`, the same tasks `task check` runs
# in sequence, so local and CI cannot drift.
#
# `changes` decides which jobs a pull request's diff reaches, from .github/buckets.yml
# (JorisJonkers-dev/github-workflows docs/path-buckets.md). A push to main or a dispatch runs
# everything. The trigger has no `paths:` filter, because a filtered trigger reports no check,
# and a check that never reports can never be required.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/path-buckets.yml@16d241e44f03c5cc4696d2d0de615717a61ef3c0 # v0.36.0
    with:
      workflows: .github/workflows/ci.yml

  check:
    name: Check (${{ matrix.task }})
    needs: changes
    # A matrix entry cannot carry its own `if`, so each entry names the gate it needs and the
    # first step ends the job early when that bucket is off. A value that is a lone expression keeps
    # its type, and a boolean never equals 'true', so every gate is turned into that string.
    runs-on: ubuntu-latest
    # The unit gate's gobco passes take most of this: 17 to 19 minutes before Audit Events.
    timeout-minutes: 35
    strategy:
      # Every failure is reported, not only the first.
      fail-fast: false
      matrix:
        include:
          - {task: "lint:go", on: "${{ (fromJSON(needs.changes.outputs.run).go || fromJSON(needs.changes.outputs.run).db) && 'true' || 'false' }}"}
          - {task: "lint:spec", on: "${{ (fromJSON(needs.changes.outputs.run).contract) && 'true' || 'false' }}"}
          - {task: "lint:web", on: "${{ (fromJSON(needs.changes.outputs.run).web || fromJSON(needs.changes.outputs.run).contract) && 'true' || 'false' }}"}
          - {task: "lint:actions", on: "true"}
          - {task: "gen:check", on: "${{ (fromJSON(needs.changes.outputs.run).app) && 'true' || 'false' }}"}
          - {task: "test:go:unit", on: "${{ (fromJSON(needs.changes.outputs.run).go) && 'true' || 'false' }}"}
          - {task: "test:web", on: "${{ (fromJSON(needs.changes.outputs.run).web) && 'true' || 'false' }}"}
          - {task: "test:integration", on: "${{ (fromJSON(needs.changes.outputs.run).go || fromJSON(needs.changes.outputs.run).db) && 'true' || 'false' }}"}
          - {task: build, on: "${{ (fromJSON(needs.changes.outputs.run).app) && 'true' || 'false' }}"}
          - {task: secrets, on: "true"}
    steps:
      - name: Skip when this diff does not reach it
        if: ${{ matrix.on != 'true' }}
        env:
          TASK: ${{ matrix.task }}
        run: echo "No path in this diff reaches $TASK."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ matrix.on == 'true' }}

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        if: ${{ matrix.on == 'true' }}
        with:
          cache: true
          cache_save: ${{ github.event_name == 'push' }}

      # gobco builds every package afresh in a copy of the module, so without a warm build cache the
      # unit gate spends most of its time compiling the Kubernetes client and zitadel/oidc again.
      # Only main saves: pull-request caches pushed the repository over its 10 GB and evicted main's.
      - name: Restore the Go build cache
        id: go-cache
        if: ${{ matrix.on == 'true' && contains(fromJSON('["lint:go", "gen:check", "test:go:unit", "test:integration", "build"]'), matrix.task) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ matrix.task }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ matrix.task }}-

      - name: Run the task
        if: ${{ matrix.on == 'true' }}
        env:
          TASK: ${{ matrix.task }}
        run: mise exec -- task "$TASK"

      - name: Save the Go build cache
        if: ${{ github.event_name == 'push' && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The binary the e2e shards run, built once, and the Playwright version the lockfile resolves, so
  # the shards' image always carries the browsers that version expects, also after Renovate bumps it.
  e2e-build:
    name: End-to-end build
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.run).app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version="$(grep -m1 -E "^  '@playwright/test@[0-9]" pnpm-lock.yaml | sed -E "s/^  '@playwright\/test@([0-9][^']*)':.*/\1/")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no @playwright/test version in pnpm-lock.yaml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Only what the build needs.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: true
          cache_save: ${{ github.event_name == 'push' }}
          install_args: go node pnpm task

      - name: Build the binary
        run: task build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-binary
          path: bin/identity
          retention-days: 1

  # Each device in two shards. The official Playwright image already holds the browsers and every
  # system package they need, so no job waits on an apt mirror. What `task db` starts with compose
  # are service containers here, reached by their names; the migration and the transit keys run as
  # container steps on the same network, from the images compose uses.
  e2e:
    name: End-to-end (${{ matrix.project }} ${{ matrix.shard }})
    needs: [changes, e2e-build]
    if: ${{ fromJSON(needs.changes.outputs.run).app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.e2e-build.outputs.playwright }}-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-retries 30
      vault:
        image: hashicorp/vault:1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-only-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health"
          --health-interval 2s
          --health-retries 30
    env:
      # Firefox refuses a HOME the container's root user does not own; mise installs under it too.
      HOME: /root
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      E2E_SMTP_ADDR: mailpit:1025
      E2E_MAILPIT_URL: http://mailpit:8025
      E2E_VAULT_ADDR: http://vault:8200
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # compose.yaml's `migrate`: the cluster's runner and changelog, signed in as the service's user.
      - name: Migrate Postgres with liquibase-runner
        uses: docker://ghcr.io/jorisjonkers-dev/liquibase-runner:v0.2.0@sha256:5e0f07bea045f35170f9d66ececa2de5ba198bf8ba51a2d11234e3c1b44ff7ea
        env:
          DATABASE_HOST: postgres
          DATABASE_PORT: "5432"
          DATABASE_NAME: app
          DATABASE_USERNAME: app
          DATABASE_PASSWORD: app
        with:
          entrypoint: sh
          args: -c "cp -r db/changelog /liquibase/ && exec runner ci up 000000000000"

      # compose.yaml's `vault-init`: the transit keys that seal TOTP secrets and sign tokens.
      - name: Make the transit keys
        uses: docker://hashicorp/vault:1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
        env:
          VAULT_ADDR: http://vault:8200
          VAULT_TOKEN: dev-only-root
        with:
          entrypoint: sh
          args: -c "vault secrets enable transit && vault write -f transit/keys/identity-totp && vault write -f transit/keys/identity-signing"

      # Only what the suite needs; the image brings the browsers.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: true
          cache_save: ${{ github.event_name == 'push' }}
          install_args: node pnpm task

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-binary
          path: bin

      # An artifact does not keep the file mode.
      - run: chmod +x bin/identity

      - name: End-to-end with axe
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: task e2e:ci -- "--project=$PROJECT" "--shard=$SHARD"

      - name: Keep the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: web/blob-report
          retention-days: 7

  # One HTML report from every shard, for reading a failure. Not part of Pipeline Complete.
  e2e-report:
    name: End-to-end report
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: true
          cache_save: ${{ github.event_name == 'push' }}
          install_args: node pnpm task

      - name: Install JS tooling
        run: task install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge the reports
        run: pnpm --filter @identity/web exec playwright merge-reports --reporter html ../all-blob-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # A quarantined test must name its issue and run out within 14 days (estate testing standards).
  quarantine:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/quarantine-check.yml@16d241e44f03c5cc4696d2d0de615717a61ef3c0 # v0.36.0

  # Mutants that survive on the changed lines, as one pull request comment. A report: it never fails
  # the build, so Pipeline Complete does not wait on it.
  mutation:
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/mutation-report.yml@16d241e44f03c5cc4696d2d0de615717a61ef3c0 # v0.36.0
    permissions:
      contents: read
      pull-requests: write
    with:
      go-directory: ${{ fromJSON(needs.changes.outputs.run).go && '.' || '' }}
      web-directory: ${{ fromJSON(needs.changes.outputs.run).web && 'web' || '' }}

  # The image builds need the Docker daemon the runner has, so they are not a task.
  images:
    name: Image (${{ matrix.image }})
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.run).app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: identity
            args: ""
          - image: identity-migration
            args: "-f Dockerfile.migration"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        env:
          IMAGE: ${{ matrix.image }}
          ARGS: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086 # ARGS is a list of options, split on purpose
          docker build --build-arg VERSION=ci $ARGS -t "$IMAGE:ci" .

  # The one required check: green only when every job above passed or was skipped by its
  # bucket. `changes` itself must pass, so a broken buckets file can never read as green.
  # `always()` so a failed or cancelled job still reports here, as a failure.
  pipeline-complete:
    name: Pipeline Complete
    if: ${{ always() }}
    needs: [changes, check, e2e-build, e2e, images, quarantine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not reached
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          [ "$CHANGES" = success ] || { echo "changes ended ${CHANGES}"; exit 1; }
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "a job ended ${result}"; exit 1 ;;
            esac
          done
