# Tag -> release flow (org standard).
#
# release-please maintains a release PR that accumulates conventional commits
# and, when merged, creates a vX.Y.Z git tag + GitHub Release and bumps the
# version manifest. The server and migration images are published to GHCR at
# that tag by the jobs below.
#
# This gives every repo an explicit, immutable version. Consumers pin exact
# versions (see VERSIONING.md); nothing deploys or resolves from a moving
# branch.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with the personal-stack-agents App token (not the
      # default GITHUB_TOKEN) so CI runs on the PR without a manual approval
      # gate. Best-effort: falls back to GITHUB_TOKEN when the App secrets or
      # installation are absent.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # identity's server and its migration, at the release's tag, so a sign-in kit's flow-conformance
  # suite (contract/flows) can run the identity whose contract it pins.
  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@f3bb6cabaa6ee33694f8632ce273a4e703d60780 # v0.38.0
    with:
      image-name: identity
      version: ${{ needs.release-please.outputs.tag_name }}
      software-version: ${{ needs.release-please.outputs.tag_name }}
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write

  migration-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@f3bb6cabaa6ee33694f8632ce273a4e703d60780 # v0.38.0
    with:
      image-name: identity-migration
      version: ${{ needs.release-please.outputs.tag_name }}
      # The changelog's version, not the liquibase-runner base the image is built on.
      software-version: ${{ needs.release-please.outputs.tag_name }}
      dockerfile: Dockerfile.migration
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write
