openapi: 3.1.0
info:
  title: identity API
  version: 1.0.0
  description: >-
    The contract the Go server (ogen) and the Vue client (@hey-api/openapi-ts) are both generated
    from. Change this document first; `task gen` regenerates both sides and `task gen:check` fails
    when either is stale.
  contact:
    name: Joris Jonkers
    url: https://github.com/JorisJonkers-dev
  license:
    name: Proprietary
    url: https://github.com/JorisJonkers-dev/identity/blob/main/LICENSE
servers:
  - url: https://auth.jorisjonkers.dev
    description: Production. The SPA and the API share one origin.
    x-internal: false
security:
  - session: []
tags:
  - name: service
    description: Facts about the running service.
  - name: account
    description: Signing up, confirming an email, and signing in and out.
  - name: profile
    description: What a signed-in User may change about themselves.
  - name: launcher
    description: The apps a signed-in User can open.
  - name: access
    description: >-
      Groups, their members, and the App Roles each Group holds on each Client. Only Admins may
      read or change any of it, and being an Admin gives no App Role (docs/adr/0004).
  - name: tokens
    description: >-
      Personal Tokens: bearer credentials a User mints for one Client, checked by the Client at
      /oidc/introspect (docs/adr/0017). A token never carries more than the User's App Roles there.
  - name: audit
    description: >-
      Audit Events: sign-ins, failed sign-ins, and changes to Users, Groups and Assignments, kept
      for one year. Only Admins may read them.
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      summary: The running version
      description: The version of the build that is serving, for the Launcher's footer and for checks after a deploy. Needs no sign-in.
      tags: [service]
      security: []
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/signup:
    post:
      operationId: signUp
      summary: Sign up
      description: >-
        Registers an unconfirmed User and mails a confirmation link. Answers 202 whether or not the
        email is already registered, so the answer never tells who has an account.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUp"
      responses:
        "202":
          description: A confirmation link is on its way, or the address was told it already has an account.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/confirmations:
    post:
      operationId: confirmEmail
      summary: Confirm an email
      description: >-
        Creates the User a sign-up describes, given the token from the mailed link and the password
        chosen at sign-up, within 24 hours. A wrong password leaves the link usable.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Confirmation"
      responses:
        "204":
          description: The email is confirmed; the User can sign in.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/session:
    post:
      operationId: signIn
      summary: Sign in
      description: >-
        Checks an email and a password and starts a Single sign-on session in a host-only cookie.
        A wrong email and a wrong password get the same 401.
      tags: [account]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignIn"
      responses:
        "204":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              required: true
              schema:
                type: string
                maxLength: 256
        "202":
          description: >-
            The password is right and the User has a Second Factor. A short-lived challenge cookie
            is set; completeSignIn takes the code.
          headers:
            Set-Cookie:
              description: The challenge cookie, good for five minutes.
              required: true
              schema:
                type: string
                maxLength: 256
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactorNeeded"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: signOut
      summary: Sign out
      description: Ends this session and clears its cookie.
      tags: [account]
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              required: true
              schema:
                type: string
                maxLength: 256
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/launcher:
    get:
      operationId: getLauncher
      summary: The apps the signed-in User can open
      description: >-
        One entry per Client the User holds an App Role on, sorted by label. Icons are served from
        identity's own origin.
      tags: [launcher]
      responses:
        "200":
          description: The apps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Launcher"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/profile:
    get:
      operationId: getProfile
      summary: The signed-in User's Profile
      description: Who is signed in.
      tags: [profile]
      responses:
        "200":
          description: The Profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateProfile
      summary: Change the signed-in User's name
      description: Changes what the User is called.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The changed Profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/profile/password:
    post:
      operationId: changePassword
      summary: Change the signed-in User's password
      description: Replaces the password after checking the current one.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: The password is changed.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/session/second-factor:
    post:
      operationId: completeSignIn
      summary: Finish signing in with a Second Factor
      description: >-
        Takes a code from the User's authenticator app for the sign-in the challenge cookie names,
        and starts a session proved by both. A challenge takes five codes; a code works once.
      tags: [account]
      security:
        - challenge: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecondFactorCode"
      responses:
        "204":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie. The spent challenge cookie expires on its own.
              required: true
              schema:
                type: string
                maxLength: 256
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/profile/second-factors:
    get:
      operationId: listSecondFactors
      summary: The signed-in User's Second Factors
      description: Every authenticator app and passkey the User added.
      tags: [profile]
      responses:
        "200":
          description: The Second Factors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactors"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/profile/second-factors/totp:
    post:
      operationId: startTOTP
      summary: Start adding an authenticator app
      description: >-
        Makes a secret for a new authenticator app. It is kept, sealed by Vault, for ten minutes,
        until confirmTOTP gets a right code from the app.
      tags: [profile]
      responses:
        "200":
          description: What to put into the authenticator app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetup"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/profile/second-factors/totp/confirmation:
    post:
      operationId: confirmTOTP
      summary: Finish adding an authenticator app
      description: >-
        Keeps the authenticator app startTOTP set up once it gives a right code and the User's
        password is right. A User who already has one must be in a session that proved it. Every
        other session of the User's ends.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPConfirmation"
      responses:
        "204":
          description: The authenticator app is a Second Factor of the User's.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/session/passkey:
    post:
      operationId: passkeyOptions
      summary: Start the passkey step of a sign-in
      description: Returns the WebAuthn options for the sign-in the challenge cookie names.
      tags: [account]
      security:
        - challenge: []
      responses:
        "200":
          description: The options for navigator.credentials.get.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/session/passkey/assertion:
    post:
      operationId: completeSignInWithPasskey
      summary: Finish signing in with a passkey
      description: >-
        Checks the browser's passkey answer for the sign-in the challenge cookie names, and starts
        a session proved by password and passkey. A refused answer counts as a wrong code.
      tags: [account]
      security:
        - challenge: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAssertion"
      responses:
        "204":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie.
              required: true
              schema:
                type: string
                maxLength: 256
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/profile/second-factors/passkey:
    post:
      operationId: startPasskey
      summary: Start adding a passkey
      description: Returns the WebAuthn options to make a passkey, kept for ten minutes.
      tags: [profile]
      responses:
        "200":
          description: The options for navigator.credentials.create.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/profile/second-factors/passkey/confirmation:
    post:
      operationId: confirmPasskey
      summary: Finish adding a passkey
      description: >-
        Keeps the passkey the browser made, given the User's password. A User who already has a
        Second Factor must be in a session that proved one. Every other session of the User's ends.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyConfirmation"
      responses:
        "204":
          description: The passkey is a Second Factor of the User's.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/profile/second-factors/{factorId}/removal:
    parameters:
      - name: factorId
        in: path
        required: true
        description: The Second Factor.
        schema:
          $ref: "#/components/schemas/Id"
    post:
      operationId: removeSecondFactor
      summary: Remove a Second Factor
      description: >-
        Removes one of the User's authenticator apps or passkeys once they give their password,
        from a session that proved a Second Factor.
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordCheck"
      responses:
        "204":
          description: Removed.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/access:
    get:
      operationId: getAccess
      summary: Groups, Users, Clients and Assignments
      description: Everything the access page shows, in one read. Admins only.
      tags: [access]
      responses:
        "200":
          description: The access overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessOverview"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/access/groups:
    post:
      operationId: createGroup
      summary: Make a Group
      description: Makes an empty Group. Names are unique whatever their case. Admins only.
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupDraft"
      responses:
        "201":
          description: The new Group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/access/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    patch:
      operationId: renameGroup
      summary: Rename a Group
      description: No token carries a Group's name, so renaming one changes nothing for any app. Admins only.
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupDraft"
      responses:
        "204":
          description: Renamed.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGroup
      summary: Delete a Group
      description: Deletes a Group with its memberships and Assignments. The admins Group cannot be deleted. Admins only.
      tags: [access]
      responses:
        "204":
          description: Deleted.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/access/groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: addMember
      summary: Put a User in a Group
      description: Adding a member twice changes nothing. Admins only.
      tags: [access]
      responses:
        "204":
          description: The User is a member.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeMember
      summary: Take a User out of a Group
      description: The admins Group always keeps one member. Admins only.
      tags: [access]
      responses:
        "204":
          description: The User is not a member.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/access/users/{userId}/sign-out:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: signOutUser
      summary: Sign a User out on every device
      description: >-
        Ends all of the User's sessions. Apps that support back-channel logout are told, and apps
        behind the Gate ask the User to sign in again. Signing out a User with no session does
        nothing. Admins only.
      tags: [access]
      responses:
        "204":
          description: The User has no session.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/access/groups/{groupId}/roles/{clientId}/{role}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/ClientId"
      - $ref: "#/components/parameters/Role"
    put:
      operationId: assignRole
      summary: Give a Group an App Role on a Client
      description: >-
        Makes an Assignment. The Client must be in the cluster and declare the App Role, and the
        admins Group holds none. Assigning twice changes nothing. Admins only.
      tags: [access]
      responses:
        "204":
          description: The Group holds the App Role.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unassignRole
      summary: Take an App Role from a Group
      description: Removes an Assignment, also one on a Removed Client. Admins only.
      tags: [access]
      responses:
        "204":
          description: The Group does not hold the App Role.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/audit:
    get:
      operationId: listAuditEvents
      summary: Audit Events, newest first
      description: >-
        One page of Audit Events, newest first, narrowed by any of the filters. Pass a page's next
        as before to read the page after it. Admins only, from a session that proved a Second Factor.
      tags: [audit]
      parameters:
        - name: user
          in: query
          description: Only events by or about this User.
          schema:
            $ref: "#/components/schemas/Id"
        - name: client
          in: query
          description: Only events about this Client.
          schema:
            $ref: "#/components/schemas/ClientId"
        - name: kind
          in: query
          description: Only events of this kind.
          schema:
            $ref: "#/components/schemas/AuditKind"
        - name: before
          in: query
          description: A page's next, to read the page after it.
          schema:
            $ref: "#/components/schemas/AuditCursor"
      responses:
        "200":
          description: One page of Audit Events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      summary: How things stand
      description: >-
        Users, the Unassigned queue, sign-ins and failed sign-ins over the last 24 hours, and live
        sessions. Admins only, from a session that proved a Second Factor.
      tags: [audit]
      responses:
        "200":
          description: The dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/profile/tokens:
    get:
      operationId: listMyTokens
      summary: My Personal Tokens
      description: The signed-in User's tokens, newest first, and the Clients they may mint one for.
      tags: [tokens]
      responses:
        "200":
          description: The User's tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTokens"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: mintToken
      summary: Mint a Personal Token
      description: >-
        Makes a token for one Client the User holds an App Role on, lasting 30, 90 or 365 days. The
        answer carries the token itself, once; identity keeps only its hash.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenDraft"
      responses:
        "201":
          description: The new token, with its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedToken"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/profile/tokens/{patId}:
    parameters:
      - $ref: "#/components/parameters/PatId"
    delete:
      operationId: revokeMyToken
      summary: Revoke one of my Personal Tokens
      description: The token is refused from now on. Revoking it twice changes nothing.
      tags: [tokens]
      responses:
        "204":
          description: Revoked.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/access/users/{userId}/tokens:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: listUserTokens
      summary: A User's Personal Tokens
      description: Admins only, from a session that proved a Second Factor.
      tags: [tokens]
      responses:
        "200":
          description: The User's tokens, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/access/users/{userId}/tokens/{patId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/PatId"
    delete:
      operationId: revokeUserToken
      summary: Revoke a User's Personal Token
      description: Admins only, from a session that proved a Second Factor. Revoking it twice changes nothing.
      tags: [tokens]
      responses:
        "204":
          description: Revoked.
        "4XX":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    challenge:
      type: apiKey
      in: cookie
      name: __Host-identity_challenge
      description: >-
        A sign-in whose password was right, waiting for its Second Factor: set by signIn's 202,
        host-only, HttpOnly, Secure, SameSite=Lax, for five minutes.
    session:
      type: apiKey
      in: cookie
      name: __Host-identity_session
      description: >-
        The Single sign-on session, set by signIn as a host-only, HttpOnly, Secure, SameSite=Lax
        cookie. The API takes JSON bodies only, so a cross-site form cannot post to it.
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      description: The Group.
      schema:
        $ref: "#/components/schemas/Id"
    UserId:
      name: userId
      in: path
      required: true
      description: The User.
      schema:
        $ref: "#/components/schemas/Id"
    ClientId:
      name: clientId
      in: path
      required: true
      description: The Client, by its id.
      schema:
        $ref: "#/components/schemas/ClientId"
    PatId:
      name: patId
      in: path
      required: true
      description: The Personal Token.
      schema:
        $ref: "#/components/schemas/Id"
    Role:
      name: role
      in: path
      required: true
      description: The App Role.
      schema:
        $ref: "#/components/schemas/AppRole"
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AuditKind:
      description: The family of an Audit Event.
      type: string
      enum: [sign-in, people, access, tokens]
    AuditAction:
      description: What an Audit Event records.
      type: string
      enum:
        - signed-in
        - sign-in-failed
        - signed-out
        - user-created
        - user-renamed
        - password-changed
        - second-factor-added
        - second-factor-removed
        - admin-promoted
        - group-created
        - group-renamed
        - group-deleted
        - member-added
        - member-removed
        - role-assigned
        - role-removed
        - token-minted
        - token-revoked
    AuditCursor:
      description: Where a page of Audit Events ends; opaque.
      type: string
      minLength: 1
      maxLength: 100
    AuditPerson:
      description: A User an Audit Event names. A User who is gone has only an id.
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          maxLength: 400
    AuditClient:
      description: A Client an Audit Event names. A Client that is gone is labelled with its id.
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: "#/components/schemas/ClientId"
        label:
          type: string
          maxLength: 200
    AuditEvent:
      description: One Audit Event.
      type: object
      additionalProperties: false
      required: [id, at, kind, action]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        at:
          type: string
          format: date-time
          maxLength: 64
        kind:
          $ref: "#/components/schemas/AuditKind"
        action:
          $ref: "#/components/schemas/AuditAction"
        actor:
          $ref: "#/components/schemas/AuditPerson"
        user:
          $ref: "#/components/schemas/AuditPerson"
        client:
          $ref: "#/components/schemas/AuditClient"
        groupName:
          type: string
          maxLength: 64
        role:
          $ref: "#/components/schemas/AppRole"
        email:
          type: string
          maxLength: 320
          description: The address a failed sign-in gave; it may belong to no User.
        reason:
          type: string
          enum: [password, second-factor, no-access]
          description: Why a sign-in failed.
    TokenClient:
      description: A Client a token is for.
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: "#/components/schemas/ClientId"
        label:
          type: string
          maxLength: 200
    PersonalToken:
      description: A Personal Token, without its secret.
      type: object
      additionalProperties: false
      required: [id, name, client, createdAt, expiresAt, state]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          maxLength: 64
        client:
          $ref: "#/components/schemas/TokenClient"
        createdAt:
          type: string
          format: date-time
          maxLength: 64
        expiresAt:
          type: string
          format: date-time
          maxLength: 64
        lastUsedAt:
          type: string
          format: date-time
          maxLength: 64
        state:
          type: string
          enum: [active, expiring, expired, revoked]
          description: expiring is a live token that ends within seven days.
    TokenList:
      description: A User's tokens, newest first.
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/PersonalToken"
    MyTokens:
      description: The signed-in User's tokens, and the Clients they may mint one for.
      type: object
      additionalProperties: false
      required: [tokens, clients]
      properties:
        tokens:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/PersonalToken"
        clients:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/TokenClient"
    TokenDraft:
      description: A token to mint.
      type: object
      additionalProperties: false
      required: [name, clientId, days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: backup-script
        clientId:
          $ref: "#/components/schemas/ClientId"
        days:
          type: integer
          format: int32
          minimum: 30
          maximum: 365
          enum: [30, 90, 365]
    MintedToken:
      description: A new token, and its secret, which is shown only here.
      type: object
      additionalProperties: false
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/PersonalToken"
        secret:
          type: string
          maxLength: 128
          description: The bearer token. identity keeps only its hash.
    Count:
      description: A count.
      type: integer
      format: int32
      minimum: 0
      maximum: 2147483647
    WaitingUser:
      description: A User waiting for a Group, and when they confirmed their email.
      type: object
      additionalProperties: false
      required: [id, email, name, confirmedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          maxLength: 400
        confirmedAt:
          type: string
          format: date-time
          maxLength: 64
    SignInHour:
      description: Sign-ins to the Identity Provider in one hour.
      type: object
      additionalProperties: false
      required: [at, signIns, failed]
      properties:
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When the hour starts.
        signIns:
          $ref: "#/components/schemas/Count"
        failed:
          $ref: "#/components/schemas/Count"
    Dashboard:
      description: How things stand.
      type: object
      additionalProperties: false
      required: [users, usersThisWeek, unassigned, signIns, failedSignIns, hours, activeSessions, sessionUsers, tokensExpiring]
      properties:
        users:
          $ref: "#/components/schemas/Count"
        usersThisWeek:
          $ref: "#/components/schemas/Count"
        unassigned:
          type: array
          maxItems: 10000
          description: The Users waiting for a Group, the newest first.
          items:
            $ref: "#/components/schemas/WaitingUser"
        signIns:
          $ref: "#/components/schemas/Count"
        failedSignIns:
          $ref: "#/components/schemas/Count"
        hours:
          type: array
          minItems: 24
          maxItems: 24
          description: The last 24 hours, oldest first.
          items:
            $ref: "#/components/schemas/SignInHour"
        activeSessions:
          $ref: "#/components/schemas/Count"
        sessionUsers:
          $ref: "#/components/schemas/Count"
        tokensExpiring:
          $ref: "#/components/schemas/Count"
        grafanaUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Where the charts over time are, when Grafana is configured.
    AuditPage:
      description: One page of Audit Events, newest first.
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AuditEvent"
        next:
          $ref: "#/components/schemas/AuditCursor"
    Email:
      description: An email address.
      type: string
      format: email
      maxLength: 254
      example: ada@example.org
    Password:
      description: A password, 12 to 128 characters.
      type: string
      format: password
      minLength: 1
      maxLength: 512
      example: correct horse battery
    SignUp:
      description: Who is signing up.
      type: object
      additionalProperties: false
      required: [email, name, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: What the User is called, 1 to 100 characters.
          example: Ada Lovelace
        password:
          $ref: "#/components/schemas/Password"
    Confirmation:
      description: >-
        A confirmation token from a mailed link, with the password chosen at sign-up, so a link
        sent to someone else's address confirms nothing for whoever signed up with it.
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        password:
          $ref: "#/components/schemas/Password"
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: The token the link carried.
          example: q3J0h9w2mVd1fC4kJXn7p8sR1tY6uE5wB0aZ3cD9eF2
    SignIn:
      description: An email and a password.
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: The email address signed up with.
          example: ada@example.org
        password:
          $ref: "#/components/schemas/Password"
    Profile:
      description: The signed-in User.
      type: object
      additionalProperties: false
      required: [email, name, createdAt, admin, secondFactor]
      properties:
        secondFactor:
          type: boolean
          description: Whether this session was proved with a Second Factor, which the admin pages need.
        admin:
          type: boolean
          description: Whether the User is an Admin, who manages access. An Admin holds no App Role by being one.
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          maxLength: 400
          description: What the User is called.
          example: Ada Lovelace
        createdAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the User signed up.
          example: "2026-10-15T12:00:00Z"
    ProfileUpdate:
      description: A new name.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: What the User is called, 1 to 100 characters.
          example: Ada King
    PasswordChange:
      description: The current password and the new one.
      type: object
      additionalProperties: false
      required: [current, next]
      properties:
        current:
          $ref: "#/components/schemas/Password"
        next:
          $ref: "#/components/schemas/Password"
    Id:
      description: An id.
      type: string
      format: uuid
      maxLength: 36
      example: 0b6f4a52-6a8f-4b8e-9d55-6f0b0f2d6e11
    ClientId:
      description: A Client's id, the name of its Client object.
      type: string
      minLength: 1
      maxLength: 253
      pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
      example: grafana
    AppRole:
      description: An App Role a Client declares.
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z][a-z0-9-]*$"
      example: editor
    GroupDraft:
      description: What a Group is called.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: The Group's name, 1 to 64 characters.
          example: Family
    Group:
      description: A named set of Users.
      type: object
      additionalProperties: false
      required: [id, name, admins, members]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          maxLength: 256
          description: What the Group is called.
          example: Family
        admins:
          type: boolean
          description: Whether this is the admins Group, whose members are Admins and which holds no App Role.
        members:
          type: array
          maxItems: 100000
          description: The Users in the Group.
          items:
            $ref: "#/components/schemas/Id"
    Launcher:
      description: The apps a User can open.
      type: object
      additionalProperties: false
      required: [apps]
      properties:
        apps:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/LauncherApp"
    LauncherApp:
      description: A Client the User holds an App Role on.
      type: object
      additionalProperties: false
      required: [id, label, launchUrl, roles]
      properties:
        id:
          $ref: "#/components/schemas/ClientId"
        label:
          type: string
          maxLength: 253
          description: What the app is called.
          example: Grafana
        description:
          type: string
          maxLength: 500
          description: One line about the app.
          example: Metrics and alerts
        launchUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Where opening the app goes.
          example: https://grafana.jorisjonkers.dev/
        iconUrl:
          type: string
          maxLength: 300
          pattern: "^/icons/"
          description: >-
            The app's icon on identity's own origin. Absent when the app has none; the Launcher then
            shows the label's first letter, as it does when the icon fails to load.
          example: /icons/grafana?v=3f2a9c1b7d4e
        roles:
          type: array
          maxItems: 64
          description: The User's App Roles on the app.
          items:
            $ref: "#/components/schemas/AppRole"
    Person:
      description: A User, as the access page lists one.
      type: object
      additionalProperties: false
      required: [id, email, name]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        email:
          $ref: "#/components/schemas/Email"
        name:
          type: string
          maxLength: 400
          description: What the User is called.
          example: Ada Lovelace
    AccessClient:
      description: A Client in the cluster, with the App Roles it declares.
      type: object
      additionalProperties: false
      required: [id, label, roles]
      properties:
        id:
          $ref: "#/components/schemas/ClientId"
        label:
          type: string
          maxLength: 253
          description: What the Launcher calls it, or its id when it has no label.
          example: Grafana
        roles:
          type: array
          maxItems: 64
          description: The App Roles it declares, user first.
          items:
            $ref: "#/components/schemas/AppRole"
    Assignment:
      description: A Group holding one App Role on one Client.
      type: object
      additionalProperties: false
      required: [groupId, clientId, role]
      properties:
        groupId:
          $ref: "#/components/schemas/Id"
        clientId:
          $ref: "#/components/schemas/ClientId"
        role:
          $ref: "#/components/schemas/AppRole"
    AccessOverview:
      description: >-
        Every Group with its members, every User, every Client in the cluster, and every
        Assignment, including those on Removed Clients, which give no access while it is away.
      type: object
      additionalProperties: false
      required: [groups, users, clients, assignments]
      properties:
        groups:
          type: array
          maxItems: 10000
          description: The admins Group first, then by name.
          items:
            $ref: "#/components/schemas/Group"
        users:
          type: array
          maxItems: 100000
          description: Every User, by name.
          items:
            $ref: "#/components/schemas/Person"
        clients:
          type: array
          maxItems: 10000
          description: Every Client in the cluster, by label.
          items:
            $ref: "#/components/schemas/AccessClient"
        assignments:
          type: array
          maxItems: 1000000
          description: Every Assignment.
          items:
            $ref: "#/components/schemas/Assignment"
    SecondFactorNeeded:
      description: The sign-in waits for a Second Factor.
      type: object
      additionalProperties: false
      required: [methods]
      properties:
        methods:
          type: array
          minItems: 1
          maxItems: 2
          description: The kinds of Second Factor the User has, any of which finishes the sign-in.
          items:
            $ref: "#/components/schemas/SecondFactorKind"
    SecondFactorKind:
      description: An authenticator app or a passkey.
      type: string
      enum: [totp, passkey]
    PasskeyOptions:
      description: >-
        WebAuthn options, as the JSON that PublicKeyCredential.parseCreationOptionsFromJSON or
        parseRequestOptionsFromJSON reads from their publicKey member.
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: string
          maxLength: 16384
          description: The options, as JSON.
    PasskeyAssertion:
      description: The browser's answer to a passkey sign-in, as PublicKeyCredential.toJSON gives it.
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response:
          type: string
          minLength: 1
          maxLength: 16384
          description: The credential, as JSON.
    PasskeyConfirmation:
      description: A name for the new passkey, the browser's answer, and the User's password.
      type: object
      additionalProperties: false
      required: [label, response, password]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 256
          description: What to call it, 1 to 64 characters.
          example: MacBook
        response:
          type: string
          minLength: 1
          maxLength: 16384
          description: The new credential, as PublicKeyCredential.toJSON gives it.
        password:
          $ref: "#/components/schemas/Password"
    SecondFactorCode:
      description: A code from an authenticator app.
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 16
          description: The six digits the app shows.
          example: "492039"
    SecondFactor:
      description: One of a User's Second Factors.
      type: object
      additionalProperties: false
      required: [id, kind, label, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          $ref: "#/components/schemas/SecondFactorKind"
        label:
          type: string
          maxLength: 256
          description: What the User called it.
          example: Phone
        createdAt:
          type: string
          format: date-time
          maxLength: 64
          description: When it was added.
          example: "2026-10-16T12:00:00Z"
        lastUsedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When it last signed the User in.
          example: "2026-10-16T18:00:00Z"
    SecondFactors:
      description: A User's Second Factors.
      type: object
      additionalProperties: false
      required: [factors]
      properties:
        factors:
          type: array
          maxItems: 64
          description: Oldest first.
          items:
            $ref: "#/components/schemas/SecondFactor"
    TOTPSetup:
      description: What an authenticator app needs, as a QR code's URI and as a secret to type in.
      type: object
      additionalProperties: false
      required: [secret, uri]
      properties:
        secret:
          type: string
          maxLength: 64
          description: The base32 secret, for typing into the app.
          example: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        uri:
          type: string
          maxLength: 512
          description: The otpauth URI the QR code carries.
          example: otpauth://totp/jorisjonkers.dev:ada@example.org?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=jorisjonkers.dev
    TOTPConfirmation:
      description: >-
        A name for the new authenticator app, its first code, and the User's password, so a session
        someone else holds cannot add one.
      type: object
      additionalProperties: false
      required: [label, code, password]
      properties:
        password:
          $ref: "#/components/schemas/Password"
        label:
          type: string
          minLength: 1
          maxLength: 256
          description: What to call it, 1 to 64 characters.
          example: Phone
        code:
          type: string
          minLength: 1
          maxLength: 16
          description: The six digits the app shows now.
          example: "492039"
    PasswordCheck:
      description: The User's password, to confirm a change that weakens their sign-in.
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          $ref: "#/components/schemas/Password"
    Version:
      description: The running build.
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          maxLength: 64
          description: The release version, or `dev` for a local build.
          example: 0.4.0
    Problem:
      description: An RFC 9457 problem detail.
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          maxLength: 256
          description: A URI naming the problem type.
          example: about:blank
        title:
          type: string
          maxLength: 256
          description: A short summary of the problem type.
          example: Not Found
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code.
          example: 404
        detail:
          type: string
          maxLength: 1024
          description: What went wrong in this occurrence.
          example: No such path.
