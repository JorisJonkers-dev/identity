# Contract conformance, gate 2 of 3 (docs/blueprints/go-api.md §9). A rule turned off says why.
extends:
  - spectral:oas
  - "@stoplight/spectral-owasp-ruleset"
rules:
  # The SPA and the API share one origin; no cross-origin client exists.
  owasp:api8:2023-define-cors-origin: off
  # The sample service does not rate-limit. A service that does declares the RateLimit headers and
  # a 429 response, and turns this rule back on.
  owasp:api4:2023-rate-limit: off
overrides:
  # Signing up, confirming an email and signing in are how a User gets a session at all, so they
  # cannot require one. Each answers the same whoever calls it, and sign-up says nothing about who
  # has an account (signUp's description).
  - files:
      - "v1/openapi.yaml#/paths/~1api~1v1~1signup/post"
      - "v1/openapi.yaml#/paths/~1api~1v1~1confirmations/post"
      - "v1/openapi.yaml#/paths/~1api~1v1~1session/post"
  # The link mailed to a new address is followed in whatever browser opens the mail, signed in or
  # not; the link's token is the proof.
      - "v1/openapi.yaml#/paths/~1api~1v1~1email-changes~1confirmation/post"
  # A password reset is for someone who cannot sign in; the mailed link's token is the proof, and
  # asking answers the same for any email.
      - "v1/openapi.yaml#/paths/~1api~1v1~1password-resets/post"
      - "v1/openapi.yaml#/paths/~1api~1v1~1password-resets~1check/post"
      - "v1/openapi.yaml#/paths/~1api~1v1~1password-resets~1code/post"
      - "v1/openapi.yaml#/paths/~1api~1v1~1password-resets~1passkey/post"
      - "v1/openapi.yaml#/paths/~1api~1v1~1password-resets~1passkey~1assertion/post"
      - "v1/openapi.yaml#/paths/~1api~1v1~1password-resets~1completion/post"
    rules:
      owasp:api2:2023-write-restricted: off
