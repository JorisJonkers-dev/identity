# One command per loop. `task` lists targets; `task check` and `task e2e` are what CI runs.
version: "3"

vars:
  APP: identity
  # The compose Postgres (compose.yaml).
  DATABASE_URL: postgres://app:app@localhost:25432/app?sslmode=disable

tasks:
  default:
    cmd: task --list
    silent: true

  install:
    desc: Install JS tooling from the frozen lockfile
    cmd: pnpm install --frozen-lockfile
    sources: [pnpm-lock.yaml, package.json, "*/package.json"]

  gen:
    desc: Gate the contract, then regenerate the server (ogen), the schema and queries (liquibase-runner, sqlc) and the client (hey-api)
    cmds:
      - task: lint:spec
      - go generate ./...
      - task: gen:schema
      - sqlc generate
      - pnpm --filter @{{.APP}}/web gen

  gen:schema:
    desc: Migrate a throwaway Postgres with liquibase-runner and write db/schema.sql for sqlc (needs Docker)
    cmd: go run ./internal/platform/pg/pgtest/genschema db/schema.sql

  gen:check:
    desc: Fail if generated code is stale
    cmds:
      - task: gen
      - git diff --exit-code
      - cmd: |
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "generation left untracked files:" >&2
            git ls-files --others --exclude-standard >&2
            exit 1
          fi

  lint:
    desc: All linters
    cmds:
      - task: lint:go
      - task: lint:spec
      - task: lint:web
      - task: lint:actions

  lint:go:
    desc: go.sum against the module cache, golangci-lint, the estate test lints, and the gofumpt/goimports format check
    cmds:
      - go mod verify
      - golangci-lint run ./...
      - golangci-lint run --build-tags integration ./...
      - go tool testlint ./...
      - go tool testlint -tags integration ./...
      # The local run's seed and fixed code, which no release build compiles.
      - golangci-lint run --build-tags dev,integration ./cmd/seed/... ./cmd/identity/... # dev only
      - go tool testlint -tags dev,integration ./cmd/seed/... ./cmd/identity/... # dev only
      - golangci-lint fmt --diff ./...
      # The Principal contract is a module of its own, which adapters pin by its tag.
      - cmd: go vet ./...
        dir: contract/principal
      # So is its flow-conformance suite, which sign-in kits pin by theirs.
      - cmd: go vet ./...
        dir: contract/flows
      - cmd: golangci-lint run ./...
        dir: contract/flows

  lint:spec:
    desc: OpenAPI conformance; Redocly recommended-strict, Spectral with OWASP, vacuum
    deps: [install]
    cmds:
      - pnpm --filter @{{.APP}}/openapi run lint
      - vacuum lint --details --fail-severity error openapi/v1/openapi.yaml

  lint:web:
    desc: ESLint (type-checked, a11y), vue-tsc, and dependency-cruiser over the web app's layers
    deps: [install]
    cmds:
      - pnpm --filter @{{.APP}}/web lint
      - pnpm --filter @{{.APP}}/web typecheck
      - pnpm --filter @{{.APP}}/web lint:deps

  lint:actions:
    desc: actionlint on every workflow
    cmd: actionlint

  test:
    desc: Every test bucket but e2e, each with its coverage gate (docs/adr/0011)
    cmds:
      - task: test:unit
      - task: test:integration

  test:unit:
    desc: Unit tests, no Docker; Go and web at 100% of statements, branches, conditions and functions
    cmds:
      - task: test:go:unit
      - task: test:web

  test:go:unit:
    desc: Go unit tests and their gate (gobco for branches and conditions), then the local run's fixed code
    cmds:
      - sh scripts/coverage.sh unit
      - go test -count=1 -tags dev -run TestADevBuild ./cmd/identity/ # dev only

  test:integration:
    desc: Go unit and integration tests together (Postgres and liquibase-runner in testcontainers); every function reached; then the local run's seed
    cmds:
      - sh scripts/coverage.sh integration
      - go test -count=1 -tags dev,integration ./cmd/seed/ # dev only

  test:web:
    desc: Web unit tests and the coverage gate in web/vite.config.ts
    deps: [install]
    cmd: pnpm --filter @{{.APP}}/web test

  build:
    desc: Build the web app, then the binary that embeds it
    deps: [install]
    cmds:
      - pnpm --filter @{{.APP}}/web build
      - CGO_ENABLED=0 go build -trimpath -o bin/{{.APP}} ./cmd/{{.APP}}

  db:
    desc: Start the compose Postgres, Mailpit and Vault, migrate Postgres with liquibase-runner, and make the TOTP key
    cmds:
      - docker compose up -d --wait postgres mailpit vault
      - docker compose run --rm migrate
      - docker compose run --rm vault-init

  e2e:
    desc: Playwright with axe against the built binary and the compose Postgres
    deps: [build, db]
    cmds:
      - pnpm --filter @{{.APP}}/web exec playwright install --with-deps chromium
      - pnpm --filter @{{.APP}}/web e2e
    env:
      DATABASE_URL: "{{.DATABASE_URL}}"

  secrets:
    desc: Scan the working tree for secrets
    cmd: gitleaks dir --no-banner --redact .

  check:
    desc: Everything CI runs on a pull request, except the e2e suite
    cmds:
      - task: lint
      - task: gen:check
      - task: test
      - task: build
      - task: secrets

  fix:
    desc: Apply formatters and autofixes
    cmds:
      - golangci-lint fmt ./...
      - golangci-lint run --fix ./...
      - pnpm --filter @{{.APP}}/web exec eslint . --fix

  dev:
    desc: Run identity locally with the canvas's apps at http://localhost:5173 (Vite, hot reload), the API on :18480, Mailpit on :28025
    deps: [db, install]
    cmd: |
      trap 'kill 0' EXIT
      DATABASE_URL='{{.DATABASE_URL}}' VAULT_ADDR=http://localhost:28200 VAULT_TOKEN=dev-only-root \
        CLIENTS_FILE=dev/clients.yaml go run -tags dev ./cmd/seed # dev only
      DATABASE_URL='{{.DATABASE_URL}}' PUBLIC_URL=http://localhost:5173 SMTP_ADDR=localhost:21025 \
        MAIL_FROM=identity@localhost SMTP_TLS=none VAULT_ADDR=http://localhost:28200 VAULT_TOKEN=dev-only-root \
        CLIENTS_FILE=dev/clients.yaml GRAFANA_URL=https://grafana.example.org/d/identity \
        ADDR=127.0.0.1:18480 METRICS_ADDR=127.0.0.1:19480 go run -tags dev ./cmd/{{.APP}} & # dev only
      API_ORIGIN=http://localhost:18480 pnpm --filter @{{.APP}}/web dev
