# Toolchain for local work and CI (jdx/mise-action). `mise install` is the only setup step.
[tools]
go = "1.27.2"
node = "24.22.0"
pnpm = "12.13.0"
task = "3.54.0"
golangci-lint = "2.14.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
sqlc = "1.31.1"
# The release binary: building from source in CI fails whenever sum.golang.org drops a stream.
"aqua:daveshanley/vacuum" = "0.33.0"
