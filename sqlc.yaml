# Typed SQL (docs/blueprints/go-api.md §8.3): db/schema.sql, generated from the Liquibase changelog
# by `task gen`, is the schema; db/queries the SQL.
version: "2"
sql:
  - engine: postgresql
    schema: db/schema.sql
    queries: db/queries
    gen:
      go:
        package: queries
        out: internal/platform/pg/queries
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz # how pg_dump spells it in db/schema.sql
            go_type: time.Time
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: {import: github.com/google/uuid, type: UUID, pointer: true}
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type: {import: time, type: Time, pointer: true}
