# Typed SQL (docs/blueprints/go-api.md §8.3): goose migrations are the schema, db/queries the SQL.
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: queries
        out: internal/platform/pg/queries
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
