# identity's alert rules, for the observability project to carry as an Asset (workspace ADR-0019):
# identity raises no alert itself. Without the release label the operator never loads the rules.
# The alert carries a count and a link, never who signed up (docs/adr/0005).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: identity
  labels:
    release: metrics-stack
spec:
  groups:
    - name: identity
      rules:
        - alert: IdentityUsersWaitingForAGroup
          expr: max(identity_unassigned_users) > 0
          for: 1m
          labels:
            severity: info
          annotations:
            summary: "{{ $value }} new User(s) wait for access"
            description: "New Users have confirmed their email but cannot open any app until an Admin gives them a role, directly or through a Group. Open the Unassigned list: https://auth.jorisjonkers.dev/admin/unassigned."
