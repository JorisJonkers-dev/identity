# deploy-kit Project Intent for identity: one Process serving the API and the embedded web app,
# reading the project's Postgres database.
#
# Not published yet. auth.jorisjonkers.dev is still served by the auth project (auth-api, auth-ui),
# so composing both would refuse the duplicate host. The host moves here at the phase 1 cutover
# (docs/adr/0006-legacy-auth-is-a-client-during-migration.md).

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: identity # the namespace derives: identity-system; the database: identity_db
owner: joris

applications:
  - id: identity
    # The binary applies its goose migrations at startup (db/migrations), so it holds the owner
    # role and startupBudget covers the migration.
    migration: self

    # No observability block: the template serves no /metrics yet.
    exposure:
      - name: public
        host: auth.jorisjonkers.dev # the Issuer's host (docs/adr/0001-build-on-zitadel-oidc.md)
        # The API requires the identity the platform's forward-auth puts on every request
        # (X-User-Id, openapi/v1/openapi.yaml), so the whole host sits behind it.
        audience: authenticated
        contentPolicy: strict
        routes:
          - { path: /, match: prefix, process: identity, surface: http }

    processes:
      - name: identity
        lifecycle: application
        image: identity # an alias; the lock resolves digest, uid and gid
        runtime: none # a static Go binary needs no Runtime Profile

        provides:
          http: 8080 # matches the default ADDR; above 1024, so no CAP_NET_BIND_SERVICE

        # The edge derives the project's database and this Process's data credential.
        dependsOn:
          - application: platform-postgres
            surface: postgres
            credentials: { rotation: { tolerates: restart } } # pgxpool reads its URL once

        placement:
          memory: 96Mi
          cpu: 50m

        probes:
          readiness: { path: /readyz, port: 8080 } # fails while Postgres does not answer
          liveness: { path: /healthz, port: 8080 }

        startupBudget: 30s # covers the migrations

        # No volumes, so a continuous cutover is honourable.
        cutover: continuous
