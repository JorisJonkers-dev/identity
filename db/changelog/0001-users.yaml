# Users, the sign-ups waiting for an email confirmation, and Single sign-on sessions (docs/adr/0005,
# 0007). A User exists only once their email is confirmed, so an unconfirmed account can never be
# taken over. Tokens are stored only as SHA-256 hashes.
databaseChangeLog:
  - changeSet:
      id: 0001-create-users
      author: identity
      changes:
        - createTable:
            tableName: users
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column: {name: email, type: text, constraints: {nullable: false, unique: true, uniqueConstraintName: users_email_key}}
              - column: {name: name, type: text, constraints: {nullable: false}}
              - column: {name: password_hash, type: text, constraints: {nullable: false}}
              - column: {name: created_at, type: timestamptz, constraints: {nullable: false}}

  # Integrity lives in the database too (docs/blueprints/go-api.md §8.2). Liquibase has no
  # open-source change type for a CHECK, so the rollback is explicit.
  - changeSet:
      id: 0001-users-checks
      author: identity
      changes:
        - sql:
            sql: >-
              ALTER TABLE users
                ADD CONSTRAINT users_email_lower CHECK (email = lower(email) AND char_length(email) BETWEEN 3 AND 254),
                ADD CONSTRAINT users_name_length CHECK (char_length(name) BETWEEN 1 AND 100)
      rollback:
        - sql:
            sql: ALTER TABLE users DROP CONSTRAINT users_email_lower, DROP CONSTRAINT users_name_length

  - changeSet:
      id: 0001-create-signups
      author: identity
      changes:
        - createTable:
            tableName: signups
            columns:
              - column: {name: token_hash, type: bytea, constraints: {primaryKey: true, nullable: false}}
              - column: {name: email, type: text, constraints: {nullable: false}}
              - column: {name: name, type: text, constraints: {nullable: false}}
              - column: {name: password_hash, type: text, constraints: {nullable: false}}
              - column: {name: expires_at, type: timestamptz, constraints: {nullable: false}}
        - createIndex:
            tableName: signups
            indexName: signups_expires_at_idx
            columns:
              - column: {name: expires_at}

  - changeSet:
      id: 0001-create-sessions
      author: identity
      changes:
        - createTable:
            tableName: sessions
            columns:
              - column: {name: token_hash, type: bytea, constraints: {primaryKey: true, nullable: false}}
              - column:
                  name: user_id
                  type: uuid
                  constraints: {nullable: false, foreignKeyName: sessions_user_fk, references: users(id), deleteCascade: true}
              - column: {name: created_at, type: timestamptz, constraints: {nullable: false}}
              - column: {name: last_seen_at, type: timestamptz, constraints: {nullable: false}}
              - column: {name: expires_at, type: timestamptz, constraints: {nullable: false}}
        - createIndex:
            tableName: sessions
            indexName: sessions_user_idx
            columns:
              - column: {name: user_id}
