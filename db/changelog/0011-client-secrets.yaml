# The hashes of Secret Clients' secrets (identity#32), shared by every replica. The secret itself
# lives only in Vault KV, at the path deploy-kit derives, where the Application reads it. After a
# rotation the secret it replaced stays accepted until the Client first uses the new one.
databaseChangeLog:
  - changeSet:
      id: 0011-create-client-secrets
      author: identity
      changes:
        - createTable:
            tableName: client_secrets
            columns:
              - column: {name: client_id, type: text, constraints: {primaryKey: true, nullable: false}}
              # SHA-256 of the current secret.
              - column: {name: hash, type: bytea, constraints: {nullable: false}}
              # SHA-256 of the secret a rotation replaced, until the new one is first used.
              - column: {name: previous_hash, type: bytea}
              - column: {name: created_at, type: timestamptz, constraints: {nullable: false}}
              - column: {name: rotated_at, type: timestamptz}
