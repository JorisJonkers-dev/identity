# Password reset (identity#81): a mailed link valid for 30 minutes. A User with two-factor proves it
# on the reset page first, and the reset remembers when.
databaseChangeLog:
  - changeSet:
      id: 0016-create-password-resets
      author: identity
      changes:
        - createTable:
            tableName: password_resets
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints: {primaryKey: true, nullable: false, foreignKeyName: password_resets_user_fk, references: users(id), deleteCascade: true}
              - column: {name: token_hash, type: bytea, constraints: {nullable: false, unique: true, uniqueConstraintName: password_resets_token_key}}
              - column: {name: expires_at, type: timestamptz, constraints: {nullable: false}}
              - column: {name: proved_at, type: timestamptz}
