# An authorization request records when its session last proved two-factor, so the access token its
# code buys states it (identity#108).
databaseChangeLog:
  - changeSet:
      id: 0021-auth-request-two-factor
      author: identity
      changes:
        - addColumn:
            tableName: auth_requests
            columns:
              - column: {name: two_factor_at, type: timestamptz}
