# The root changelog liquibase-runner applies (docs/adr/0010). Every changeset is recorded under
# this file name, so it never moves. One file per change beside it, included in order. The
# directory stays flat: the tests copy it into the runner file by file.
databaseChangeLog:
  - include:
      file: 0001-users.yaml
      relativeToChangelogFile: true
  - include:
      file: 0002-sign-in.yaml
      relativeToChangelogFile: true
  - include:
      file: 0003-access.yaml
      relativeToChangelogFile: true
  - include:
      file: 0004-second-factor.yaml
      relativeToChangelogFile: true
  - include:
      file: 0005-passkeys.yaml
      relativeToChangelogFile: true
  - include:
      file: 0006-gate.yaml
      relativeToChangelogFile: true
  - include:
      file: 0007-session-clients.yaml
      relativeToChangelogFile: true
  - include:
      file: 0008-audit-events.yaml
      relativeToChangelogFile: true
  - include:
      file: 0009-personal-tokens.yaml
      relativeToChangelogFile: true
  - include:
      file: 0010-signing-keys.yaml
      relativeToChangelogFile: true
  - include:
      file: 0011-client-secrets.yaml
      relativeToChangelogFile: true
