# Second Factors (docs/adr/0005, 0013): authenticator apps (TOTP) whose secrets are kept only as
# Vault transit ciphertext, an enrolment waiting for its first code, and a sign-in waiting for its
# second factor (one per User, so wrong codes cannot be spread over many sign-ins). A session
# records how it was proved, for the ID token's amr and the admin pages.
databaseChangeLog:
  - changeSet:
      id: 0004-create-totp-factors
      author: identity
      changes:
        - createTable:
            tableName: totp_factors
            columns:
              - column: {name: id, type: uuid, constraints: {primaryKey: true, nullable: false}}
              - column:
                  name: user_id
                  type: uuid
                  constraints: {nullable: false, foreignKeyName: totp_factors_user_fk, references: users(id), deleteCascade: true}
              - column: {name: label, type: text, constraints: {nullable: false}}
              - column: {name: sealed_secret, type: text, constraints: {nullable: false}}
              # The newest 30-second step a code was accepted for; a code is never accepted twice.
              - column: {name: last_step, type: bigint, constraints: {nullable: false}}
              - column: {name: created_at, type: timestamptz, constraints: {nullable: false}}
              - column: {name: last_used_at, type: timestamptz}
        - createIndex:
            tableName: totp_factors
            indexName: totp_factors_user_idx
            columns:
              - column: {name: user_id}

  - changeSet:
      id: 0004-totp-factors-checks
      author: identity
      changes:
        - sql:
            sql: >-
              ALTER TABLE totp_factors
                ADD CONSTRAINT totp_factors_label_length CHECK (label = btrim(label) AND char_length(label) BETWEEN 1 AND 64),
                ADD CONSTRAINT totp_factors_sealed CHECK (sealed_secret LIKE 'vault:v%')
      rollback:
        - sql:
            sql: ALTER TABLE totp_factors DROP CONSTRAINT totp_factors_label_length, DROP CONSTRAINT totp_factors_sealed

  - changeSet:
      id: 0004-create-totp-enrolments
      author: identity
      changes:
        - createTable:
            tableName: totp_enrolments
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints: {primaryKey: true, nullable: false, foreignKeyName: totp_enrolments_user_fk, references: users(id), deleteCascade: true}
              - column: {name: sealed_secret, type: text, constraints: {nullable: false}}
              - column: {name: expires_at, type: timestamptz, constraints: {nullable: false}}

  - changeSet:
      id: 0004-create-sign-in-challenges
      author: identity
      changes:
        - createTable:
            tableName: sign_in_challenges
            columns:
              - column: {name: token_hash, type: bytea, constraints: {primaryKey: true, nullable: false}}
              - column:
                  name: user_id
                  type: uuid
                  constraints: {nullable: false, unique: true, uniqueConstraintName: sign_in_challenges_user_key, foreignKeyName: sign_in_challenges_user_fk, references: users(id), deleteCascade: true}
              - column: {name: attempts, type: integer, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: expires_at, type: timestamptz, constraints: {nullable: false}}
              # Wrong codes count against the User, not the sign-in: a new sign-in replaces the
              # challenge but keeps its attempts until the window has passed.
              - column: {name: window_started_at, type: timestamptz, constraints: {nullable: false}}
        - createIndex:
            tableName: sign_in_challenges
            indexName: sign_in_challenges_expires_at_idx
            columns:
              - column: {name: expires_at}

  - changeSet:
      id: 0004-sessions-methods
      author: identity
      changes:
        - addColumn:
            tableName: sessions
            columns:
              - column:
                  name: methods
                  type: "text[]"
                  defaultValueComputed: "'{pwd}'::text[]"
                  constraints: {nullable: false}

  # How the session that completed a request was proved, for that request's ID token.
  - changeSet:
      id: 0004-auth-requests-methods
      author: identity
      changes:
        - addColumn:
            tableName: auth_requests
            columns:
              - column: {name: methods, type: "text[]"}
