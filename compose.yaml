# Local Postgres for `task dev` and `task e2e`. Published on 55432 so a Postgres already running
# on the default port does not collide with it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 30

  # Catches every mail a local run or the e2e suite sends; its API is how the e2e suite reads the
  # confirmation link. Never in a deployment, where mail goes to Stalwart over TLS (docs/adr/0012).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "51025:1025"
      - "58025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 30

  # `task db` runs this once Postgres is healthy: the same runner and changelog as the cluster,
  # signed in with the compose credentials instead of Vault. Not started by `docker compose up`.
  migrate:
    image: ghcr.io/jorisjonkers-dev/liquibase-runner:v0.1.0@sha256:f19a170f0285818c105939da633053b5800a7cc5d1efb4f2d8211e040bb134af
    profiles: [migrate]
    command: ["ci", "up", "000000000000"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: app
      DATABASE_USERNAME: app
      DATABASE_PASSWORD: app
    volumes:
      - ./db/changelog:/liquibase/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy
