# Local Postgres for `task dev` and `task e2e`. Published on 25432 so a Postgres already running
# on the default port does not collide with it. Every published port here stays below 32768: a
# Linux CI runner hands out 32768-60999 to outgoing connections, and a port in that range can
# already be taken when compose binds it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 30

  # Catches every mail a local run or the e2e suite sends; its API is how the e2e suite reads the
  # confirmation link. Never in a deployment, where mail goes to Stalwart over TLS (docs/adr/0012).
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "21025:1025"
      - "28025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 30

  # A dev-mode Vault, for the transit key that seals TOTP secrets (docs/adr/0013). In memory and
  # unsealed, with a fixed root token: local runs and the e2e suite only. `task db` makes the key.
  vault:
    image: hashicorp/vault:1.21.4
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "28200:8200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 2s
      retries: 30

  vault-init:
    image: hashicorp/vault:1.21.4
    profiles: [migrate]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-only-root
    entrypoint: ["sh", "-c", "vault secrets list | grep -q '^transit/' || vault secrets enable transit; vault write -f transit/keys/identity-totp; vault write -f transit/keys/identity-signing"]
    depends_on:
      vault:
        condition: service_healthy

  # `task db` runs this once Postgres is healthy: the same runner and changelog as the cluster,
  # signed in with the compose credentials instead of Vault. Not started by `docker compose up`.
  migrate:
    image: ghcr.io/jorisjonkers-dev/liquibase-runner:v0.2.0@sha256:5e0f07bea045f35170f9d66ececa2de5ba198bf8ba51a2d11234e3c1b44ff7ea
    profiles: [migrate]
    command: ["ci", "up", "000000000000"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: app
      DATABASE_USERNAME: app
      DATABASE_PASSWORD: app
    volumes:
      - ./db/changelog:/liquibase/changelog:ro
    depends_on:
      postgres:
        condition: service_healthy
